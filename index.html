<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Full Screen Image</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .image-container {
    width: 100vw;
    height: 100vh;
    /* Support for mobile browsers with dynamic toolbars */
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;   /* fills the whole screen, cropping if needed */
    object-position: center;
    display: block;
  }

  /* If you'd rather see the WHOLE image without any cropping,
     replace "cover" above with "contain" (this will add
     letterboxing/bars on some screens instead of cropping). */
</style>
</head>
<body>

<div class="image-container">
  <img src="image.jpg" alt="Full screen image">
</div>

<script>
  // Optional: prevent pinch-zoom / double-tap zoom on mobile for a cleaner full-screen feel
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, false);
</script>

</body>
</html>
